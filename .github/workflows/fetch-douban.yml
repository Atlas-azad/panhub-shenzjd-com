name: Fetch Douban Top250
 
on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
 
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
 
      - uses: actions/setup-node@v4
        with:
          node-version: 22
 
      - name: Grab Top250
        run: node scripts/grab-douban.js
 
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet server/core/data/top250.json && echo "No changes" && exit 0
          git add server/core/data/top250.json
          git commit -m "chore: update douban top250 data"
          git push
